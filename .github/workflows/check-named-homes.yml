name: CQC page check for named homes

# Manual only. Reads the public CQC page for the named locations and records what it
# shows in site_check_rating / site_check_at (rule 2 of the rating rule). Dry run
# unless `apply` is ticked. Dry run prints each home's current site_check values, so
# an applied write can be undone with:
#   UPDATE care_providers SET site_check_rating = NULL, site_check_at = NULL WHERE id IN (...)
# (using the "before" values printed by the dry run, which were NULL if none were set).
# Separate from import-cqc-ratings.yml so it can run without that workflow's scheduled
# daily and weekly writes being switched on.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated CQC location ids, e.g. 1-18589594217,1-13420883737"
        type: string
        required: true
      apply:
        description: "Write site_check_* for these ids (unticked = dry run, writes nothing)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cqc-reconciliation-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install psycopg2-binary==2.9.9 python-dotenv
      - name: Check the named CQC pages
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IDS: ${{ inputs.ids }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=(--ids "$IDS")
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          python -m tools.verify_file_ratings_against_site "${args[@]}"
