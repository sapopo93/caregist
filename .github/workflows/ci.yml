name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + pip check + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: pip check (dependency resolution)
        run: pip check

      - name: pytest
        env:
          API_MASTER_KEY: ci_test_master_key
          SUPPORT_INTERNAL_TOKEN: ci_test_support_token
        run: pytest -q

      - name: pip-audit (vulnerabilities)
        # Fail the build on known CVEs in backend deps.
        run: pip-audit --requirement requirements.txt --strict

      - name: Smoke verifier syntax
        run: python -m py_compile tools/verify-deploy.py

  migrations:
    name: Migration replay (real Postgres + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: caregist
          POSTGRES_PASSWORD: caregist
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caregist"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Replay init.sql + every migration, assert invariants
        env:
          CAREGIST_TEST_DATABASE_URL: postgresql://caregist:caregist@localhost:5432/postgres
          API_MASTER_KEY: ci_test_master_key
          SUPPORT_INTERNAL_TOKEN: ci_test_support_token
        run: pytest tests/integration/ -v

  frontend:
    name: Frontend (tsc + tests + build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          # next.config.ts throws at build time when these are missing in production mode.
          API_URL: http://localhost:8000
          API_KEY: ci_test_api_key
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

      - name: Start built app in degraded mode
        env:
          APP_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          POSTGRES_URL: ""
          DATABASE_URL: ""
          DIRECTORY_TOKEN_SECRET: ci_test_directory_secret
          PORT: "3100"
        run: |
          npm run start > /tmp/caregist-smoke.log 2>&1 &
          echo $! > /tmp/caregist-smoke.pid

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/health/directory >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/caregist-smoke.log
          exit 1

      - name: Degraded-mode smoke test
        env:
          CAREGIST_APP_URL: http://127.0.0.1:3100
          CAREGIST_LEAD_EMAIL: ci-smoke@example.com
        run: python3 ../tools/verify-deploy.py

      - name: Stop smoke server
        if: always()
        run: |
          if [ -f /tmp/caregist-smoke.pid ]; then
            kill "$(cat /tmp/caregist-smoke.pid)" || true
          fi

          if [ -f /tmp/caregist-smoke.log ]; then
            cat /tmp/caregist-smoke.log
          fi

      - name: npm audit (high/critical only)
        # Transitive dev-tool vulns are common; gate on high+ to catch real risk without noise.
        run: npm audit --audit-level=high
