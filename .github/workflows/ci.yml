name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

env:
  AI_OS_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (pytest + pip check + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-worker.txt
            requirements-worker-model.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-worker.txt
          pip install --no-deps --require-hashes -r requirements-worker-model.txt

      - name: pip check (dependency resolution)
        run: pip check

      - name: ruff (lint — real-bug ruleset)
        run: ruff check api/ tools/ db/ tests/

      - name: Evidence language guard
        run: python tools/evidence_language_guard.py

      - name: Migration governance
        run: python tools/check_migration_governance.py

      - name: pytest
        env:
          API_MASTER_KEY: ci_test_master_key
          SUPPORT_INTERNAL_TOKEN: ci_test_support_token
        run: pytest -q --ignore=tests/integration

      - name: pip-audit (vulnerabilities)
        run: |
          pip-audit --requirement requirements.txt --strict
          pip-audit --requirement requirements-api.txt --strict
          pip-audit --requirement requirements-worker.txt --strict

      - name: Smoke verifier syntax
        run: python -m py_compile tools/verify-deploy.py tools/security_evidence.py

  migrations:
    name: Migration replay (real Postgres + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: caregist
          POSTGRES_PASSWORD: caregist
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caregist"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install local media test tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Create non-superuser integration role
        env:
          PGPASSWORD: caregist
        run: >-
          psql --host localhost --username caregist --dbname postgres
          --set ON_ERROR_STOP=1
          --command "CREATE ROLE caregist_test LOGIN PASSWORD 'caregist_test' NOCREATEDB NOSUPERUSER NOBYPASSRLS"

      - name: Replay init.sql + every migration, assert invariants
        env:
          CAREGIST_TEST_ADMIN_DATABASE_URL: postgresql://caregist:caregist@localhost:5432/postgres
          CAREGIST_TEST_DATABASE_URL: postgresql://caregist_test:caregist_test@localhost:5432/postgres
          API_MASTER_KEY: ci_test_master_key
          SUPPORT_INTERNAL_TOKEN: ci_test_support_token
        run: pytest tests/integration/ -v

  container-scan:
    name: Container images (build + vulnerability scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build production images
        run: |
          docker build --tag caregist-api:ci .
          docker build --file Dockerfile.worker --tag caregist-worker:ci .

      - name: Scan API image and capture JSON
        id: scan_api
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: caregist-api:ci
          format: json
          output: artifacts/security/trivy-api.raw.json
          exit-code: "0"
          ignore-unfixed: false
          scanners: vuln
          severity: HIGH,CRITICAL

      - name: Scan worker image and capture JSON
        id: scan_worker
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: caregist-worker:ci
          format: json
          output: artifacts/security/trivy-worker.raw.json
          exit-code: "0"
          ignore-unfixed: false
          scanners: vuln
          severity: HIGH,CRITICAL

      - name: Normalize container security evidence
        if: always()
        run: |
          python3 tools/security_evidence.py normalize \
            --kind trivy \
            --input artifacts/security/trivy-api.raw.json \
            --output artifacts/security/trivy-api.json \
            --scope api-container
          python3 tools/security_evidence.py normalize \
            --kind trivy \
            --input artifacts/security/trivy-worker.raw.json \
            --output artifacts/security/trivy-worker.json \
            --scope worker-container

      - name: Publish container evidence summary
        if: always()
        run: |
          echo '## AI OS container security evidence' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/security/trivy-api.json >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/security/trivy-worker.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload container security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-os-container-security-${{ env.AI_OS_EVIDENCE_SHA }}
          path: |
            artifacts/security/trivy-api.raw.json
            artifacts/security/trivy-api.json
            artifacts/security/trivy-worker.raw.json
            artifacts/security/trivy-worker.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce container security gate
        if: always()
        run: |
          test "${{ steps.scan_api.outcome }}" = "success"
          test "${{ steps.scan_worker.outcome }}" = "success"
          python3 tools/security_evidence.py gate \
            artifacts/security/trivy-api.json \
            artifacts/security/trivy-worker.json

  frontend:
    name: Frontend (tsc + tests + build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          API_URL: http://localhost:8000
          API_KEY: ci_test_api_key
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

      - name: Production HTTP route contracts
        run: npm run test:production-http

      - name: Start built app in degraded mode
        env:
          APP_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          POSTGRES_URL: ""
          DATABASE_URL: ""
          DIRECTORY_TOKEN_SECRET: ci_test_directory_secret_32_chars_minimum
          CAREGIST_RELEASE_SHA: ${{ github.sha }}
          PORT: "3100"
        run: |
          npm run start > /tmp/caregist-smoke.log 2>&1 &
          echo $! > /tmp/caregist-smoke.pid

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/health/directory >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/caregist-smoke.log
          exit 1

      - name: Degraded-mode smoke test
        env:
          CAREGIST_APP_URL: http://127.0.0.1:3100
          CAREGIST_EXPECTED_GIT_SHA: ${{ github.sha }}
          CAREGIST_SKIP_BACKEND_PATHS: "1"
          CAREGIST_LEAD_EMAIL: ci-smoke@example.com
        run: python3 ../tools/verify-deploy.py

      - name: Stop smoke server
        if: always()
        run: |
          if [ -f /tmp/caregist-smoke.pid ]; then
            kill "$(cat /tmp/caregist-smoke.pid)" || true
          fi

          if [ -f /tmp/caregist-smoke.log ]; then
            cat /tmp/caregist-smoke.log
          fi

      - name: Capture npm audit JSON
        id: npm_audit
        continue-on-error: true
        run: |
          mkdir -p ../artifacts/security
          npm audit --audit-level=high --json > ../artifacts/security/frontend-npm-audit.raw.json

      - name: Normalize frontend security evidence
        if: always()
        run: |
          python3 ../tools/security_evidence.py normalize \
            --kind npm \
            --input ../artifacts/security/frontend-npm-audit.raw.json \
            --output ../artifacts/security/frontend-npm-audit.json \
            --scope frontend-npm

      - name: Publish frontend evidence summary
        if: always()
        run: |
          echo '## AI OS frontend security evidence' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat ../artifacts/security/frontend-npm-audit.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload frontend security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-os-frontend-security-${{ env.AI_OS_EVIDENCE_SHA }}
          path: |
            artifacts/security/frontend-npm-audit.raw.json
            artifacts/security/frontend-npm-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce frontend security gate
        if: always()
        run: python3 ../tools/security_evidence.py gate ../artifacts/security/frontend-npm-audit.json
