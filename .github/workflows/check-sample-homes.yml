name: Check sample homes (one-off)
on:
  push:
    branches: [claude/project-thread-kncmuu]
    paths: [tools/check_sample_homes.py, .github/workflows/check-sample-homes.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_sample_homes.py
