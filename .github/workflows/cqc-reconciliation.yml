name: CQC reconciliation

# The Sunday 02:15 UTC schedule was held back deliberately, pending the condition
# recorded here: a manual production batch passing every staging and production
# acceptance gate. Run 34861567936 (2026-09-14 19:37 UTC) met it -- completed/success,
# finalize success, active=57150 deactivated=50 -- so the schedule is now live.
#
# Two runs a week, not one: the customer-facing freshness promise this pipeline backs
# (api/services/pipeline_health.py, SOURCE_FRESHNESS_SLA) is 8 days, so a single weekly
# run leaves one day of margin and a single missed run would publish stale data.
# Each scheduled run passes the same validate/prepare/finalize/abort gates and the same
# non-cancelling concurrency group as a manual dispatch, and writes only from main.
#
# Scheduled events carry NO inputs -- the `inputs` context is empty for every event other
# than workflow_dispatch. Every input-derived value below therefore declares an explicit
# fallback, and every write path names the schedule event explicitly, instead of leaning
# on `inputs.dry_run == false` coercion. The sleep fallback literal must stay in step with
# the `sleep` input default above.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the source and projected runtime without writes
        type: boolean
        default: true
      sleep:
        description: Seconds between CQC detail requests
        type: string
        default: "0.08"
      resume_batch_id:
        description: Failed batch UUID to resume (requires resume_run_id)
        type: string
        default: ""
      resume_run_id:
        description: Actions run containing the immutable manifest (requires resume_batch_id)
        type: string
        default: ""

  schedule:
    - cron: "15 2 * * 0"  # Sunday 02:15 UTC
    - cron: "15 2 * * 3"  # Wednesday 02:15 UTC

permissions:
  contents: read
  actions: read

concurrency:
  group: cqc-reconciliation-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  SHARD_COUNT: "8"
  CHECKPOINT_SIZE: "250"
  SNAPSHOT_MANIFEST: cqc-snapshot-manifest.json
  BUDGET_HOURS: "5.0"
  ASSUMED_LATENCY_S: "1.40"
  FIXED_OVERHEAD_S: "300"
  RETRY_FACTOR: "1.15"
  SNAPSHOT_MARGIN: "1.10"

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject ambiguous or unreviewed write intent
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          RESUME_BATCH_ID: ${{ inputs.resume_batch_id }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          EXECUTING_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os

          dry_run = os.environ["DRY_RUN"].lower() == "true"
          scheduled = os.environ["EVENT_NAME"] == "schedule"
          batch = os.environ["RESUME_BATCH_ID"].strip()
          run = os.environ["RESUME_RUN_ID"].strip()
          if bool(batch) != bool(run):
              raise SystemExit("resume_batch_id and resume_run_id must be supplied together")
          if dry_run and batch:
              raise SystemExit("resume inputs cannot be combined with dry_run=true")
          if scheduled and (batch or run):
              raise SystemExit("a scheduled run takes no resume inputs")
          if scheduled and dry_run:
              raise SystemExit("a scheduled run reconciles for real and cannot be a dry run")
          if not dry_run and os.environ["EXECUTING_REF"] != "refs/heads/main":
              raise SystemExit("production reconciliation writes must run from refs/heads/main")
          PY

  dry-run:
    if: github.event_name != 'schedule' && inputs.dry_run
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate immutable snapshot without writes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          BATCH_ID="$(python -c 'import uuid; print(uuid.uuid4())')"
          python incremental_update.py --phase prepare --dry-run \
            --batch-id "$BATCH_ID" --shard-count "$SHARD_COUNT" \
            --snapshot-manifest "$SNAPSHOT_MANIFEST"

  prepare:
    if: github.event_name == 'schedule' || inputs.dry_run == false
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      batch_id: ${{ steps.batch.outputs.batch_id }}
      shard_count: ${{ steps.matrix.outputs.shard_count }}
      shard_indices: ${{ steps.matrix.outputs.shard_indices }}
      state_opened: ${{ steps.prepare_new.outputs.state_opened || steps.resume.outputs.state_opened }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify credentials and sharded CLI
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CQC_API_KEY: ${{ secrets.CQC_API_KEY }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$CQC_API_KEY"
          python incremental_update.py --help | grep -q -- "--checkpoint-size"
      - id: batch
        name: Select a new batch or one bounded resume
        env:
          RESUME_BATCH_ID: ${{ inputs.resume_batch_id }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          python - <<'PY'
          import os
          import uuid

          batch = os.environ["RESUME_BATCH_ID"].strip()
          run = os.environ["RESUME_RUN_ID"].strip()
          if bool(batch) != bool(run):
              raise SystemExit("resume_batch_id and resume_run_id must be supplied together")
          if batch:
              parsed = uuid.UUID(batch)
              if str(parsed) != batch.lower() or not run.isdigit() or int(run) < 1:
                  raise SystemExit("resume inputs must be a canonical UUID and positive run ID")
              resume = "true"
          else:
              batch = str(uuid.uuid4())
              resume = "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"batch_id={batch}\nresume={resume}\n")
          PY
      - name: Project per-shard runtime using SELECT only
        if: steps.batch.outputs.resume == 'false'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SLEEP: ${{ inputs.sleep || '0.08' }}
        run: |
          python - <<'PY'
          import os
          import psycopg2
          with psycopg2.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
              cur.execute("SELECT count(*) FROM care_providers WHERE upper(status) = 'ACTIVE'")
              active = int(cur.fetchone()[0])
          details = active * float(os.environ["SNAPSHOT_MARGIN"]) / int(os.environ["SHARD_COUNT"])
          seconds = float(os.environ["FIXED_OVERHEAD_S"]) + details * (
              float(os.environ["SLEEP"]) + float(os.environ["ASSUMED_LATENCY_S"])
          ) * float(os.environ["RETRY_FACTOR"])
          hours = seconds / 3600
          print(f"projected shard runtime: {hours:.2f}h")
          if hours > float(os.environ["BUDGET_HOURS"]):
              raise SystemExit("projected shard runtime exceeds the five-hour budget")
          PY
      - name: Download the original immutable manifest
        if: steps.batch.outputs.resume == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cqc-manifest-${{ steps.batch.outputs.batch_id }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - id: prepare_new
        name: Prepare authoritative batch
        if: steps.batch.outputs.resume == 'false'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RELEASE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python incremental_update.py --phase prepare \
            --batch-id "${{ steps.batch.outputs.batch_id }}" --shard-count "$SHARD_COUNT" \
            --snapshot-manifest "$SNAPSHOT_MANIFEST" \
            --release-sha "$RELEASE_SHA" --workflow-run-id "$WORKFLOW_RUN_ID" \
            --workflow-run-attempt "$WORKFLOW_RUN_ATTEMPT"
          echo "state_opened=true" >> "$GITHUB_OUTPUT"
      - id: matrix
        name: Derive the immutable shard matrix
        env:
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
        run: |
          python - <<'PY'
          import json
          import os

          with open(os.environ["SNAPSHOT_MANIFEST"], encoding="utf-8") as source:
              manifest = json.load(source)
          if manifest.get("batchId") != os.environ["BATCH_ID"]:
              raise SystemExit("manifest batch ID mismatch")
          count = int(manifest.get("shardCount", 0))
          if count < 1:
              raise SystemExit("manifest shard count must be positive")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"shard_count={count}\n")
              output.write(f"shard_indices={json.dumps(list(range(count)), separators=(',', ':'))}\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cqc-manifest-${{ steps.batch.outputs.batch_id }}
          path: ${{ env.SNAPSHOT_MANIFEST }}
          if-no-files-found: error
          retention-days: 7
      - id: resume
        name: Authorize the single resume wave after artifact validation
        if: steps.batch.outputs.resume == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RELEASE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python incremental_update.py --phase resume \
            --batch-id "${{ steps.batch.outputs.batch_id }}" \
            --snapshot-manifest "$SNAPSHOT_MANIFEST" \
            --resume-source-run-id "${{ inputs.resume_run_id }}" \
            --release-sha "$RELEASE_SHA" --workflow-run-id "$WORKFLOW_RUN_ID" \
            --workflow-run-attempt "$WORKFLOW_RUN_ATTEMPT"
          echo "state_opened=true" >> "$GITHUB_OUTPUT"

  shards:
    if: github.event_name == 'schedule' || inputs.dry_run == false
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard_index: ${{ fromJSON(needs.prepare.outputs.shard_indices) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cqc-manifest-${{ needs.prepare.outputs.batch_id }}
      - name: Run resumable shard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CQC_API_KEY: ${{ secrets.CQC_API_KEY }}
        run: |
          python incremental_update.py --phase shard \
            --batch-id "${{ needs.prepare.outputs.batch_id }}" \
            --snapshot-manifest "$SNAPSHOT_MANIFEST" \
            --shard-count "${{ needs.prepare.outputs.shard_count }}" \
            --shard-index "${{ matrix.shard_index }}" --checkpoint-size "$CHECKPOINT_SIZE" \
            --sleep "${{ inputs.sleep || '0.08' }}"

  finalize:
    if: github.event_name == 'schedule' || inputs.dry_run == false
    needs: [prepare, shards]
    runs-on: ubuntu-latest
    # 60, not 30. On 2026-09-20 this job ran 29m37s with no per-phase output and
    # was cancelled by the old 30-minute cap having written nothing, losing the
    # batch (run 35510678221) and leaving the freshness surface degraded.
    #
    # Where the time went is NOT established by that run's log: it contains no
    # output between the invocation and the cancellation, so the 29m37s covers
    # the whole finalize phase. A read-only pg_stat_activity probe taken while it
    # was stalled found no active query and no lock wait, so the phase was not
    # blocked in Postgres; the only network-bound step ahead of the table lock is
    # the candidate confirmation loop, which fetches one candidate at a time from
    # the same API the shards had just been hammering and honours Retry-After with
    # backoff capped at 30s. That points at the confirmation loop, but it is an
    # inference from the absence of database activity, not a measurement - which
    # is why this change also prints phase boundaries, so the next run measures
    # where the time goes instead of inferring it.
    #
    # The cap is an operational bound, not a correctness gate: the fail-closed
    # refusal for unconfirmed candidates and the identity-equality guard are both
    # untouched by this value. Prior finalizes with few candidates took 42s and
    # 75s; the same 127-candidate set classifies in ~17s against an unthrottled
    # API. This is headroom for a legitimate slow path, not a threshold lowered to
    # obtain a pass.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cqc-manifest-${{ needs.prepare.outputs.batch_id }}
      - name: Publish reconciled watermark
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python incremental_update.py --phase finalize \
            --batch-id "${{ needs.prepare.outputs.batch_id }}" \
            --snapshot-manifest "$SNAPSHOT_MANIFEST" \
            --shard-count "${{ needs.prepare.outputs.shard_count }}"
  abort-incomplete:
    if: ${{ always() && (github.event_name == 'schedule' || inputs.dry_run == false) && needs.prepare.outputs.state_opened == 'true' && (needs.prepare.result != 'success' || needs.shards.result != 'success' || needs.finalize.result != 'success') }}
    needs: [prepare, shards, finalize]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Close orphaned batch state after matrix failure
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python incremental_update.py --phase abort \
            --batch-id "${{ needs.prepare.outputs.batch_id }}"
