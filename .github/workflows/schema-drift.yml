name: Schema Drift

# Guards the failure mode that took the public search API down on 2026-09-20:
# `main` shipped code selecting a column production had never been given, because
# nothing applied migrations from `main` and no gate compared the two. This check
# compares the migrations in the commit against the production ledger and fails
# while any are unapplied, so the drift surfaces on the pull request instead of in
# production traffic.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-schema-current:
    # Fork pull requests get no secrets; the read-only ledger check needs one.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Production schema is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Validate migration chain
        run: python tools/check_migration_governance.py
      - name: Fail while production has not applied this commit's migrations
        env:
          # The production pipeline is provisioned with DATABASE_URL; the migration
          # tool reads it from its guarded production variable.
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python db/apply_migrations.py --target production --check
