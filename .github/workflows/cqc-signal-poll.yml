name: CQC signal poll

on:
  workflow_dispatch:
    inputs:
      sweep_size:
        description: Active locations to refresh in this shadow run
        type: string
        default: "1200"
  schedule:
    # Twice hourly so 7 days * 48 scheduled polls can meet the 336-poll gate.
    # Typical successful runs complete in 16-24 minutes; overlapping runs are
    # not cancelled. The Python time budget is 45 minutes, below the 50-minute
    # job timeout, so GitHub does not kill a still-running poll unmarked.
    - cron: "7,37 * * * *"

permissions:
  contents: read

concurrency:
  group: cqc-signal-poll-production
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Poll approved CQC sources in shadow mode
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CQC_API_KEY: ${{ secrets.CQC_API_KEY }}
          CQC_LOCATION_INDEX_POLL_ENABLED: ${{ vars.CQC_LOCATION_INDEX_POLL_ENABLED || 'false' }}
          CQC_REPORT_POLL_ENABLED: ${{ vars.CQC_REPORT_POLL_ENABLED || 'false' }}
          RADAR_DELIVERY_ENABLED: "false"
        run: >-
          python -m tools.poll_cqc_signals
          --sweep-size "${{ inputs.sweep_size || '1200' }}"
          --checkpoint-size 100
          --sleep 0.05
