name: Preview Smoke

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: preview-smoke-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production'
    name: Verify preview release SHA and public paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Smoke exact preview commit
        env:
          CAREGIST_APP_URL: ${{ github.event.deployment_status.environment_url }}
          CAREGIST_EXPECTED_GIT_SHA: ${{ github.event.deployment.sha }}
          CAREGIST_SMOKE_ATTEMPTS: "12"
          CAREGIST_SMOKE_RETRY_DELAY_SECONDS: "15"
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: python tools/verify-deploy.py
