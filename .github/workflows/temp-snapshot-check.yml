          1-2017040253|Good|33|Beech Grove Care Home
          1-114969802|Good|40|Abbeyfield Care Home Clitheroe
          1-203276918|Good|24|Lowfield house Limited
          1-29716664953|Not yet rated|66|Middleshaw Hills Care Home
