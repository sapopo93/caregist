name: Import CQC ratings file

# The CareGist rating rule, operated:
#   1. Daily: if CQC has published a newer "Latest ratings" file, import it with
#      its edition date (migration 070). The file is the main rating source.
#   2. Weekly: check CQC's own location pages where a newer report is likely
#      (tools/verify_file_ratings_against_site.py --targets newer-reports); a page
#      check made after the file edition wins where it differs.
#   4. Every run ends with the source/disagreement report.
# Manual dispatch: dry run unless `apply` is ticked; the importer writes only the
# file_* columns and the page check only site_check_*.
on:
  schedule:
    - cron: "47 4 * * *"   # daily new-file check
    - cron: "23 20 * * 0"   # weekly CQC page check (Sunday evening)
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the file_* columns (unticked = dry run, writes nothing)"
        type: boolean
        default: false
      ods_url:
        description: "Override: exact ODS URL (leave blank to discover it on CQC's data page)"
        type: string
        default: ""
      edition_date:
        description: "Override: edition date YYYY-MM-DD (required with ods_url)"
        type: string
        default: ""
      site_check:
        description: "Also run the CQC page check (writes site_check_* only when apply is ticked)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: import-cqc-ratings
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 4 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install psycopg2-binary==2.9.9 python-dotenv
      - name: Locate the ratings file
        id: src
        env:
          ODS_URL: ${{ inputs.ods_url }}
          EDITION: ${{ inputs.edition_date }}
        run: |
          if [ -n "$ODS_URL" ]; then
            test -n "$EDITION" || { echo "edition_date is required with ods_url" >&2; exit 1; }
            { echo "url=$ODS_URL"; echo "edition=$EDITION"; } >> "$GITHUB_OUTPUT"
          else
            python -m tools.find_cqc_ratings_file | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Download
        env:
          URL: ${{ steps.src.outputs.url }}
        run: |
          curl -fsSL -A "CareGist-ratings-import/1.0 (+https://caregist.co.uk)" -o "$RUNNER_TEMP/ratings.ods" "$URL"
          sha256sum "$RUNNER_TEMP/ratings.ods"
      - name: Import (scheduled runs apply only a newer edition; manual runs dry-run unless apply)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EDITION: ${{ steps.src.outputs.edition }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          args=("$RUNNER_TEMP/ratings.ods" --edition-date "$EDITION")
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          if [ "$SCHEDULED" = "true" ]; then args+=(--only-if-newer); fi
          python -m tools.import_cqc_latest_ratings "${args[@]}"
      - name: Ratings-file staleness after import
        if: github.event_name == 'schedule' || inputs.apply
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m tools.check_file_ratings_freshness

  site-check:
    if: github.event.schedule == '23 20 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.site_check)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install psycopg2-binary==2.9.9 python-dotenv
      - name: Check CQC pages where a newer report is likely
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          args=(--targets newer-reports --limit 2000)
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          python -m tools.verify_file_ratings_against_site "${args[@]}"

  report:
    needs: [import, site-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install psycopg2-binary==2.9.9
      - name: Rating sources and disagreements
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_URL: https://caregist.co.uk
        run: python -m tools.report_rating_disagreements --csv "$RUNNER_TEMP/rating-disagreements.csv"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rating-disagreements
          path: ${{ runner.temp }}/rating-disagreements.csv
          retention-days: 90
