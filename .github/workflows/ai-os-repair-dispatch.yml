name: AI OS Repair Dispatch

permissions:
  contents: read
  issues: write

on:
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'ai-os-repair')
    runs-on: ubuntu-latest
    steps:
      - name: Build machine-readable dispatch marker
        if: github.event_name == 'issues'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if printf '%s' "$ISSUE_BODY" | grep -q '\*\*Codex\*\*'; then
            status=READY
            worker_profile=coder
            provider=openai-codex
          else
            status=AWAITING_APPROVAL
            worker_profile=none
            provider=none
          fi

          cat > /tmp/dispatch.md <<EOF
          <!-- ai-os-dispatch -->
          AI_OS_DISPATCH
          issue: ${ISSUE_NUMBER}
          source: github_issue
          orchestrator: hermes:ai-company-governed
          worker_profile: ${worker_profile}
          provider: ${provider}
          status: ${status}
          human_input_required: $([ "$status" = READY ] && echo false || echo true)
          END_AI_OS_DISPATCH
          EOF

      - name: Publish dispatch marker once
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json comments \
            --jq '.comments[].body' | grep -q 'AI_OS_DISPATCH'; then
            echo "Dispatch marker already exists"
            exit 0
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/dispatch.md

      - name: Publish contract summary
        run: |
          echo '## AI OS repair dispatch' >> "$GITHUB_STEP_SUMMARY"
          echo 'Issues labelled `ai-os-repair` with Codex as repair owner are emitted as READY for `hermes:ai-company-governed` → `coder` → `openai-codex`.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Other repair issues fail closed as AWAITING_APPROVAL.' >> "$GITHUB_STEP_SUMMARY"
