name: Supply snapshot (read-only)

# Builds the data table for a paid supply snapshot: older-people care homes within a
# radius of a postcode, with rating, beds, registration status and registration date
# read from CQC itself (see tools/supply_snapshot.py). Reads the database, writes
# nothing, prints the table in the log with a checksum.
#
# Run by dispatch with a postcode and radius, or (so it can run from a branch before
# it reaches main) by pushing snapshot_requests/latest.txt containing `postcode|miles`.

on:
  workflow_dispatch:
    inputs:
      postcode:
        description: "Site postcode, e.g. CA11 8TZ"
        type: string
        required: true
      radius:
        description: "Radius in miles"
        type: string
        default: "5"
  push:
    branches: [claude/project-thread-kncmuu]
    paths: [snapshot_requests/latest.txt]

permissions:
  contents: read

concurrency:
  group: supply-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install psycopg2-binary==2.9.9
      - name: Build the table from CQC
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CQC_API_KEY: ${{ secrets.CQC_API_KEY }}
          IN_POSTCODE: ${{ inputs.postcode }}
          IN_RADIUS: ${{ inputs.radius }}
        run: |
          if [ -n "$IN_POSTCODE" ]; then
            postcode="$IN_POSTCODE"; radius="${IN_RADIUS:-5}"
          else
            IFS='|' read -r postcode radius < snapshot_requests/latest.txt
          fi
          python -m tools.supply_snapshot --postcode "$postcode" --radius "${radius:-5}"
