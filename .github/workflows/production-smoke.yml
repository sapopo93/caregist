name: Production Smoke

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Night window only: four slots, and a public journey against the live site
    # each time. A daytime outage is therefore not seen until the next night run.
    - cron: "50 18,21,0,3 * * *"

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke live directory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run production smoke
        env:
          CAREGIST_APP_URL: https://www.caregist.co.uk
          CAREGIST_SMOKE_ATTEMPTS: "15"
          CAREGIST_SMOKE_RETRY_DELAY_SECONDS: "20"
          # A push-triggered run proves that the commit which triggered the
          # deploy is the commit being served. Scheduled and manually
          # dispatched runs use the pinned repository variables, which remain
          # available as an operator override.

          CAREGIST_EXPECTED_FRONTEND_GIT_SHA: ${{ github.event_name == 'push' && github.sha || vars.CAREGIST_PRODUCTION_FRONTEND_SHA }}
          CAREGIST_EXPECTED_BACKEND_GIT_SHA: ${{ github.event_name == 'push' && github.sha || vars.CAREGIST_PRODUCTION_BACKEND_SHA }}
          CAREGIST_REQUIRE_RELEASE_IDENTITY: "true"
        run: python tools/verify-deploy.py
