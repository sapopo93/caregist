name: Freshness Watchdog

on:
  workflow_dispatch:
    inputs:
      confirm_production_backup:
        description: "Assert a production restore point (Neon PITR) exists before applying migrations"
        type: boolean
        default: false
  schedule:
    # One checkpoint at the end of the night, after the 03:00 poll has finished.
    # A daytime run would only report the staleness the night window intends.
    - cron: "10 4 * * *"

permissions:
  contents: read

concurrency:
  group: freshness-watchdog
  cancel-in-progress: false

jobs:
  apply-production-migrations:
    # This job was hard-gated to `codex/radar-checkout-audit-20260814`, a branch that
    # no longer exists, which left `main` with no supported route to apply a
    # migration — the drift that took search down on 2026-09-20. The deliberate act
    # is now the explicit restore-point input below, not a remembered branch name.
    if: github.event_name == 'workflow_dispatch'
    name: Apply production migrations (explicitly confirmed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Validate migration chain
        run: python tools/check_migration_governance.py
      - name: Refuse without an asserted restore point
        # The deliberate act that must accompany a production schema change. A
        # human asserts it at dispatch time; CI cannot assert it on its own behalf.
        run: |
          if [ "${{ inputs.confirm_production_backup }}" != "true" ]; then
            echo "Refusing to apply: re-dispatch with confirm_production_backup=true to assert a production restore point (Neon PITR)." >&2
            exit 1
          fi
      - name: Apply forward-only production migrations
        env:
          # The production pipeline is provisioned with DATABASE_URL. Map it
          # explicitly to the migration tool's guarded production variable.
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >-
          python db/apply_migrations.py
          --target production
          --confirm-production-backup
      - name: Verify Radar checkout schema
        env:
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def verify():
              conn = await asyncpg.connect(os.environ["PROD_DATABASE_URL"])
              try:
                  applied = await conn.fetchval(
                      "SELECT EXISTS (SELECT 1 FROM schema_migrations WHERE filename = $1)",
                      "056_radar_signup_purchase_intent.sql",
                  )
                  constraint = await conn.fetchval(
                      "SELECT pg_get_constraintdef(oid) FROM pg_constraint "
                      "WHERE conname = 'users_signup_purchase_intent_valid'",
                  )
                  if not applied or not constraint or "radar-regional" not in constraint or "radar-national" not in constraint:
                      raise SystemExit("Radar signup intent migration verification failed")
                  print("Radar checkout migration and signup intent constraint verified")
              finally:
                  await conn.close()

          asyncio.run(verify())
          PY
      - name: Verify production has no pending migrations
        env:
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python db/apply_migrations.py --target production --check

  freshness:
    name: Check reconciled CQC freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install watchdog dependencies
        # The watchdog imports api.services.pipeline_health -> api.config, which
        # requires pydantic-settings. Installing asyncpg alone crash-failed every
        # scheduled run in ~17s before any check executed, leaving freshness
        # unmonitored. Install the full API requirement set so the import graph
        # the script actually uses is present.
        run: python -m pip install -r requirements-api.txt

      # The monitor must not be granted API_MASTER_KEY, SUPPORT_INTERNAL_TOKEN,
      # WEBHOOK_SECRET_KEY or REDIS_URL. It reads only DATABASE_URL (and the
      # Resend pair when notifications are explicitly enabled).
      - name: Check freshness and notify operations
        id: freshness
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # api.config runs settings.validate_production() at import time, and
          # DATABASE_URL here points at production, so app_url is validated too.
          # Without this the watchdog died on the import with
          # "FATAL: APP_URL must be a public HTTPS origin ..." and never checked
          # anything. Same origin the other production workflows use.
          APP_URL: https://caregist.co.uk
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ENQUIRY_FROM_EMAIL: ${{ secrets.ENQUIRY_FROM_EMAIL }}
          PIPELINE_ALERT_EMAIL: ops@caregist.co.uk
          WATCHDOG_NOTIFICATIONS_ENABLED: ${{ vars.FRESHNESS_WATCHDOG_NOTIFICATIONS_ENABLED || 'false' }}
        run: |
          set -o pipefail
          test -n "$DATABASE_URL"
          case "$WATCHDOG_NOTIFICATIONS_ENABLED" in
            false)
              echo "Watchdog notifications are explicitly disabled; health remains fail-closed"
              python -m tools.check_new_registration_pipeline | tee /tmp/snapshot.json
              ;;
            true)
              test -n "$RESEND_API_KEY"
              test -n "$ENQUIRY_FROM_EMAIL"
              python -m tools.check_new_registration_pipeline --notify | tee /tmp/snapshot.json
              ;;
            *)
              echo "Invalid FRESHNESS_WATCHDOG_NOTIFICATIONS_ENABLED value" >&2
              exit 1
              ;;
          esac

      # Monitor execution health and CQC source-data freshness are two distinct
      # verdicts. A monitor that runs cleanly proves nothing about the data.
      # This step always runs so a crashed monitor is reported as UNKNOWN
      # freshness rather than silently absent.
      - name: Report monitor health and source freshness separately
        if: always()
        env:
          MONITOR_OUTCOME: ${{ steps.freshness.outcome }}
        run: python tools/report_watchdog_verdicts.py --snapshot /tmp/snapshot.json
