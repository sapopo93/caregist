name: Freshness Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: freshness-watchdog
  cancel-in-progress: false

jobs:
  freshness:
    name: Check reconciled CQC freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install watchdog dependencies
        run: python -m pip install asyncpg==0.29.0

      - name: Check freshness and notify operations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ENQUIRY_FROM_EMAIL: ${{ secrets.ENQUIRY_FROM_EMAIL }}
          PIPELINE_ALERT_EMAIL: ops@caregist.co.uk
        run: python tools/check_new_registration_pipeline.py --notify
