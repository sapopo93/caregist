name: Radar schema release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY-RADAR-SCHEMA to apply migrations; this does not enable checkout
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: radar-checkout-production-release
  cancel-in-progress: false

jobs:
  migrate:
    if: inputs.confirmation == 'APPLY-RADAR-SCHEMA'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Validate migration chain
        run: |
          python tools/check_migration_governance.py
          python -m pytest tests/integration/test_migrations_apply_cleanly.py -q
      - name: Apply forward-only production migrations
        env:
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >-
          python db/apply_migrations.py
          --target production
          --confirm-production-backup
      - name: Verify Radar checkout schema
        env:
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def verify():
              conn = await asyncpg.connect(os.environ["PROD_DATABASE_URL"])
              try:
                  applied = await conn.fetchval(
                      "SELECT EXISTS (SELECT 1 FROM schema_migrations WHERE filename = $1)",
                      "056_radar_signup_purchase_intent.sql",
                  )
                  constraint = await conn.fetchval(
                      "SELECT pg_get_constraintdef(oid) FROM pg_constraint "
                      "WHERE conname = 'users_signup_purchase_intent_valid' "
                      "AND conrelid = 'public.users'::regclass",
                  )
                  if not applied or not constraint or "radar-regional" not in constraint or "radar-national" not in constraint:
                      raise SystemExit("Radar signup intent migration verification failed")
                  print("Radar checkout migration and signup intent constraint verified")
              finally:
                  await conn.close()

          asyncio.run(verify())
          PY
