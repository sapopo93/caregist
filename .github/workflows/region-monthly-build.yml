name: Region Monthly build

# NOT ENABLED FOR SCHEDULING. The schedule trigger below is commented out on
# purpose. Do not enable it until the owner has approved Region Monthly builds
# (docs/region-monthly-v1.md, open questions). Until then only a person can
# start this workflow, with workflow_dispatch.
#
# Region Monthly builds one record per UK calendar month, England region and
# service type. A month may be built only from 00:00 UK time on the 7th day of
# the following month, so the job is meant to run on the 7th of each month. The
# cron time 06:30 UTC is after that moment in both GMT and BST.
#
# Writing needs ALL of these, checked in validate-inputs:
#   - dry_run is false (a scheduled run, when enabled, writes);
#   - the run is from refs/heads/main;
#   - the repository variable REGION_MONTHLY_BUILD_APPROVED is "true".
# A dry run counts inside a read-only transaction and writes nothing.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Count and report without writing any build
        type: boolean
        default: true
      period_month:
        description: Month to build as YYYY-MM. Empty builds the latest month that can be built.
        type: string
        default: ""

  # schedule:
  #   - cron: "30 6 7 * *"  # 7th of each month, 06:30 UTC. Keep commented out until the owner approves.

permissions:
  contents: read

concurrency:
  group: region-monthly-build
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject unreviewed write intent
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PERIOD_MONTH: ${{ inputs.period_month }}
          EXECUTING_REF: ${{ github.ref }}
          WRITES_APPROVED: ${{ vars.REGION_MONTHLY_BUILD_APPROVED }}
        run: |
          python - <<'PY'
          import os
          import re

          # A scheduled event carries no inputs, so DRY_RUN is empty and the run writes.
          dry_run = os.environ["DRY_RUN"].lower() == "true"
          period = os.environ["PERIOD_MONTH"].strip()
          if period and not re.fullmatch(r"\d{4}-(0[1-9]|1[0-2])", period):
              raise SystemExit("period_month must look like 2026-10")
          if not dry_run and os.environ["EXECUTING_REF"] != "refs/heads/main":
              raise SystemExit("Region Monthly writes must run from refs/heads/main")
          if not dry_run and os.environ["WRITES_APPROVED"] != "true":
              raise SystemExit("Region Monthly writes need the owner's approval (REGION_MONTHLY_BUILD_APPROVED)")
          PY

  dry-run:
    if: github.event_name != 'schedule' && inputs.dry_run
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Count without writing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PERIOD_MONTH: ${{ inputs.period_month }}
        run: |
          python -m tools.build_region_monthly --dry-run ${PERIOD_MONTH:+--period-month "$PERIOD_MONTH"}

  build:
    if: github.event_name == 'schedule' || inputs.dry_run == false
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Store immutable builds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PERIOD_MONTH: ${{ inputs.period_month }}
        run: |
          python -m tools.build_region_monthly --write ${PERIOD_MONTH:+--period-month "$PERIOD_MONTH"}
