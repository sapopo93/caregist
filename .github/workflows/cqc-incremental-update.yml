name: CQC incremental update

# Detects CQC rating changes, new registrations and deactivations.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ THE SCHEDULE IS DELIBERATELY NOT ENABLED YET. See "Before scheduling".  │
# └─────────────────────────────────────────────────────────────────────────┘
#
# WHY THIS EXISTS
# The hourly `feed-cycle` Vercel cron only syncs NEW REGISTRATIONS. Nothing has
# ever run incremental_update.py on a schedule, so `rating_changes` was empty on
# 2026-08-01 and the weekly digest had been reporting "0 CQC rating changes this
# week" since 6 July.
#
# WHY NOT VERCEL CRON
# CQC's /changes/location endpoint now returns 404, so a run must reconcile the
# full directory — ~58k locations, one HTTP call each. That is hours of work and
# cannot run in a serverless function.
#
# BEFORE SCHEDULING — two blockers, both real
#
# 1. RUNTIME. Measured CQC detail latency (2026-08-01, 10 samples): median
#    0.163s, mean 0.222s. A single unsharded run of ~58k details projects to
#    ~5.1h on median and ~6.0h on mean. GitHub kills any job at 6h, and the
#    script commits only after every detail is fetched — so a killed job writes
#    NOTHING and leaves a `pipeline_runs` row stuck in 'running'. A weekly
#    schedule would burn hours and achieve nothing. The workload must be sharded
#    (~4 shards ≈ 1.5h each) before a schedule is safe.
#
# 2. CODE VERSION. The snapshot-reconciliation rewrite that handles the 404
#    correctly — and any --shard-count support — is NOT on main. It exists only
#    in unpushed local commits (main differs by ~400 lines). Scheduling this
#    against main today would run the superseded list-scan path.
#
# 3. A DRY RUN IS NOT READ-ONLY. In incremental_update.py the insert into
#    pipeline_alert_log is guarded by `if cur is not None` and NOT by
#    `not args.dry_run`, so every dry run commits a 'changes_endpoint_unavailable'
#    row. That table already holds 3,286 rows, all of them that one alert. Fix
#    before scheduling:
#
#        - if cur is not None:
#        + if cur is not None and not args.dry_run:
#
#    and consider deduplicating the existing rows. This workflow no longer runs
#    a dry run for sizing, so it does not add to the pile, but anyone invoking
#    --dry-run by hand still does.
#
# The pre-flight below enforces 1 and 2: it refuses to run unless the script
# supports sharding and the projected duration fits the budget. Add the
# `schedule:` trigger once a dispatched run passes pre-flight and completes.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report changes without writing to the database"
        type: boolean
        default: true
      since:
        description: "ISO date to fetch changes from (default: last pipeline run)"
        type: string
        required: false
      sleep:
        description: "Seconds between CQC API calls (lower = faster, more API load)"
        type: string
        default: "0.08"
      shard_count:
        description: "Split the workload into N shards (4 recommended for a full run)"
        type: string
        default: "4"
      shard_index:
        description: "Which shard to process, 0-based"
        type: string
        default: "0"

permissions:
  contents: read

# Never let two reconciliations write concurrently. The script also takes a
# database advisory lock, but that only releases when its connection dies.
concurrency:
  group: cqc-incremental-update
  cancel-in-progress: false

env:
  # Refuse to start work that cannot finish inside GitHub's 6h hard kill.
  BUDGET_HOURS: "5.0"
  # Conservative per-call cost: measured mean latency plus runner margin.
  ASSUMED_LATENCY_S: "0.28"
  # Checkout, dependency install and the run's own snapshot download. The
  # snapshot alone measured 4.7s; the rest is install time.
  FIXED_OVERHEAD_S: "300"
  # fetch_location_detail retries with escalating backoff on transient
  # failures. Over tens of thousands of calls that is not negligible, and
  # omitting it was how the first version of this gate understated the run.
  RETRY_FACTOR: "1.15"
  # Locations present in the CQC snapshot but not yet in our directory, so the
  # real workload slightly exceeds our stored active count.
  SNAPSHOT_MARGIN: "1.10"

jobs:
  update:
    runs-on: ubuntu-latest
    # Below the 6h hard kill, so our own timeout fires first with a clear
    # message rather than an opaque cancellation.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify credentials are present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CQC_API_KEY: ${{ secrets.CQC_API_KEY }}
        run: |
          # Presence only. Never echo a value.
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL secret is not set"; exit 1; }
          test -n "$CQC_API_KEY" || { echo "::error::CQC_API_KEY secret is not set"; exit 1; }
          echo "credentials present"

      # Blocker 2: refuse to run a version of the pipeline that predates the
      # 404-aware rewrite, rather than silently reconciling with superseded code.
      - name: Pre-flight — check the pipeline supports sharding
        run: |
          if ! python incremental_update.py --help 2>&1 | grep -q -- "--shard-count"; then
            echo "::error::incremental_update.py on this branch has no --shard-count support."
            echo "::error::The snapshot-reconciliation rewrite is not on main yet; push it before scheduling."
            exit 1
          fi
          echo "pipeline supports sharding"

      - name: Resolve run parameters
        id: params
        env:
          IN_SLEEP: ${{ inputs.sleep }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_SHARDS: ${{ inputs.shard_count }}
          IN_INDEX: ${{ inputs.shard_index }}
        run: |
          SLEEP="${IN_SLEEP:-0.08}"
          # A scheduled run, once enabled, has no inputs and must write.
          DRY="${IN_DRY:-false}"
          SHARDS="${IN_SHARDS:-4}"
          INDEX="${IN_INDEX:-0}"
          for v in "sleep=$SLEEP" "shard_count=$SHARDS" "shard_index=$INDEX"; do
            echo "$v" >> "$GITHUB_OUTPUT"
          done
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          echo "sleep=$SLEEP dry_run=$DRY shard=$INDEX/$SHARDS"

      # Blocker 1: size the real workload and refuse if it cannot finish.
      #
      # This gate is STRICTLY READ-ONLY and does not execute the pipeline. An
      # earlier version ran `incremental_update.py --dry-run` to size the work,
      # which was wrong twice over:
      #
      #   * that dry run reaches an INSERT into pipeline_alert_log that is
      #     guarded only by `if cur is not None`, never by `not args.dry_run`,
      #     so the gate committed a row to production on every execution. That
      #     table already holds 3,286 rows, all 'changes_endpoint_unavailable'.
      #   * it measured only detail-fetch time, ignoring checkout, install,
      #     snapshot download and retry backoff, so it understated the run.
      #
      # A SELECT against care_providers gives the same sizing without touching
      # anything, and the projection now carries explicit overhead and retry terms.
      - name: Pre-flight — project the run duration (read-only)
        id: preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SLEEP: ${{ steps.params.outputs.sleep }}
          SHARDS: ${{ steps.params.outputs.shard_count }}
        run: |
          python - <<'PY'
          import os, psycopg2

          # SELECT only. This step must never mutate production.
          with psycopg2.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
              cur.execute("SELECT count(*) FROM care_providers WHERE upper(status) = 'ACTIVE'")
              active = cur.fetchone()[0]

          shards = int(os.environ["SHARDS"])
          details = int(active * float(os.environ["SNAPSHOT_MARGIN"]) / shards)
          per_call = float(os.environ["SLEEP"]) + float(os.environ["ASSUMED_LATENCY_S"])
          overhead = float(os.environ["FIXED_OVERHEAD_S"])
          retry = float(os.environ["RETRY_FACTOR"])
          hours = (overhead + details * per_call * retry) / 3600
          budget = float(os.environ["BUDGET_HOURS"])

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"details={details}\n")

          print(f"active_locations={active} shards={shards} details_this_shard={details}")
          print(f"per_call={per_call:.3f}s retry_factor={retry} overhead={overhead:.0f}s")
          print(f"projected={hours:.2f}h budget={budget}h")
          if hours > budget:
              print(f"::error::Projected {hours:.2f}h exceeds the {budget}h budget. The job would be "
                    f"killed at 6h having committed nothing. Raise shard_count or lower sleep.")
              raise SystemExit(1)
          print(f"::notice::Projected {hours:.2f}h for shard, within {budget}h budget.")
          PY

      - name: Run incremental update
        if: steps.params.outputs.dry == 'false'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CQC_API_KEY: ${{ secrets.CQC_API_KEY }}
          IN_SINCE: ${{ inputs.since }}
          SLEEP: ${{ steps.params.outputs.sleep }}
          SHARDS: ${{ steps.params.outputs.shard_count }}
          INDEX: ${{ steps.params.outputs.shard_index }}
          DETAILS: ${{ steps.preflight.outputs.details }}
        run: |
          echo "reconciling $DETAILS locations (shard $INDEX/$SHARDS) at --sleep $SLEEP"
          ARGS="--sleep $SLEEP --shard-count $SHARDS --shard-index $INDEX"
          [ -n "$IN_SINCE" ] && ARGS="$ARGS --since $IN_SINCE"
          python incremental_update.py $ARGS

      - name: Report pipeline outcome
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, psycopg2
          with psycopg2.connect(os.environ["DATABASE_URL"]) as c, c.cursor() as cur:
              cur.execute("SELECT count(*) FROM rating_changes")
              print("rating_changes rows:", cur.fetchone()[0])
              cur.execute("SELECT count(*) FROM care_providers")
              print("care_providers rows:", cur.fetchone()[0])
              cur.execute(
                  "SELECT run_type, status, started_at FROM pipeline_runs "
                  "ORDER BY started_at DESC LIMIT 3"
              )
              for row in cur.fetchall():
                  print("recent run:", row)
              # A job killed mid-loop leaves this behind; surface it loudly so a
              # stuck run is never mistaken for a healthy one.
              cur.execute(
                  "SELECT count(*) FROM pipeline_runs WHERE status='running' "
                  "AND started_at < now() - interval '7 hours'"
              )
              stale = cur.fetchone()[0]
              if stale:
                  print(f"::warning::{stale} pipeline_runs row(s) stuck in 'running' for over 7h")
          PY
