# RETIRED / NON-OPERATIVE Render manifest retained only for historical reference.
# Production uses Vercel multi-service plus Neon. Do not apply this blueprint.
# Its environment contract is nevertheless fail-closed to prevent legacy product
# activation if an old Render integration still reads the file.
services:
  - type: cron
    name: weekly-movers-digest
    runtime: python
    region: frankfurt
    schedule: "0 8 * * 1"
    buildCommand: pip install -r requirements-api.txt
    startCommand: python tools/send_weekly_movers.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_URL
        value: https://caregist.co.uk

  - type: cron
    name: monitor-alerts
    runtime: python
    region: frankfurt
    schedule: "0 7 * * *"
    buildCommand: pip install -r requirements-api.txt
    startCommand: python tools/send_monitor_alerts.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_URL
        value: https://caregist.co.uk

  - type: web
    name: caregist-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: python db/apply_migrations.py && uvicorn api.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_MASTER_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRODUCT_RADAR_REGIONAL
        sync: false
      - key: STRIPE_PRICE_RADAR_REGIONAL
        sync: false
      - key: STRIPE_PRODUCT_RADAR_NATIONAL
        sync: false
      - key: STRIPE_PRICE_RADAR_NATIONAL
        sync: false
      - key: STRIPE_PRODUCT_INTELLIGENCE_FEED
        sync: false
      - key: STRIPE_PRICE_INTELLIGENCE_FEED
        sync: false
      - key: BILLING_CHECKOUT_ENABLED
        value: "false"
      - key: RADAR_CHECKOUT_ENABLED
        value: "false"
      - key: RADAR_DELIVERY_ENABLED
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: ENQUIRY_FROM_EMAIL
        sync: false
      - key: MONITOR_ALERT_FAILURE_EMAIL
        sync: false
      - key: SUPPORT_PLATFORM_URL
        sync: false
      - key: CAREGIST_TO_SUPPORT_TOKEN
        sync: false
      - key: SUPPORT_INTERNAL_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://caregist.co.uk,https://www.caregist.co.uk,http://localhost:3000
      - key: APP_URL
        value: https://caregist.co.uk
      - key: PYTHON_VERSION
        value: "3.12.0"
    healthCheckPath: /api/v1/health
